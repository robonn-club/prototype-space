# Where to look for new listings. The events page shows this list as Resources,
# and the weekly review links it. Every Sunday the event finder (find_events.py)
# reads each source that has a `calendar` (an iCal address) or a `reader` (one
# of the page readers in find_events.py: hbrs, digitalhub; enacom also reads each
# event's own page) and proposes what is new in a pull request. `organiser` is
# the name its proposals carry.
sources:
  - name: Transfer Center enaCom, Uni Bonn
    url: https://www.uni-bonn.de/en/research-and-teaching/transfer/transfer-center-enacom/events
    note: founding, AI and IP workshops through the semester
    calendar: https://www.uni-bonn.de/en/research-and-teaching/transfer/transfer-center-enacom/events/@@event_listing_ical
    reader: enacom
  - name: Start-up-Manufaktur, H-BRS
    url: https://www.h-brs.de/de/gruenden/events
    note: founding events in Sankt Augustin and at DIGITALHUB.DE
    reader: hbrs
    organiser: Start-up-Manufaktur, Hochschule Bonn-Rhein-Sieg
  - name: Lamarr Institute
    url: https://lamarr-institute.org/current/events/
    note: AI events; most are for researchers, some meetups are open to students
    calendar: https://events.lamarr-institute.org/export/categ/11.ics?from=today
  - name: DIGITALHUB.DE
    url: https://www.digitalhub.de/en/events/eventkalender-intern
    note: meetups and pitch nights at the main station
    reader: digitalhub
  - name: MakerSpace Bonn e.V.
    url: https://www.makerspacebonn.de/
    note: news posts announce workshops; the calendar shows open evenings
    calendar: https://tickets.makerspacebonn.de/msb/events/ical/?locale=de
  - name: Datenburg e.V.
    url: https://datenburg.org/
  - name: KI Summit Bonn (Meetup)
    url: https://www.meetup.com/bonner-ki-meetup/events/
    calendar: https://www.meetup.com/bonner-ki-meetup/events/ical/
    organiser: KI Summit Bonn (meetup group)
  - name: IHK Bonn/Rhein-Sieg, patent consultation
    url: https://www.ihk-bonn.de/innovation-und-umwelt/innovation/gewerbliche-schutzrechte
  - name: DPMA, workshops and seminars
    url: https://www.dpma.de/dpma/veranstaltungen/workshops/index.html

# The event finder never proposes an event whose title contains one of these
# (not case-sensitive). Add a word when the same kind of unsuitable event keeps
# coming back; a single unsuitable proposal can simply be deleted.
finder_skip:
  - game design
  - board game
  - brettspiel
  - spiel 20
  - change management
