# Workshops and events for students in Bonn who are building a prototype.
#
# Every entry comes from the organiser's own page, linked as `source`, and says
# when it was last checked there. Search results and aggregators are not
# sources: twice while this list was first researched they gave a wrong date.
#
# You do not need to delete past events: build.py hides a dated event the day
# after it ends (Bonn time), and the site rebuilds every night. Every Sunday the
# event finder (find_events.py) proposes new listings from the organisers' own
# calendars in a pull request, and the events review (`python3 build.py --events`)
# lists what to delete, recheck or fill in. CONTRIBUTING.md, "Adding an event",
# explains every field.
#
# Values: write what the organiser's page says. Use `not stated` when you
# checked and the page does not say, and leave a field empty (~) when you have
# not checked yet. No street addresses, email addresses, phone numbers or
# names of people: give the venue and the city, and link the organiser's page.

