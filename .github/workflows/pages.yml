name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Set Settings → Pages → Source to "GitHub Actions" once, and this takes over.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Stage the guide and directory, and resolve every citation
        run: python3 build.py
      - name: Build
        run: mkdocs build --strict
      - name: Check every internal link and anchor in the built site
        run: python3 build.py --check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
