site_name: Prototype Space
site_description: >-
  A step-by-step guide for students in Bonn, from a robot idea to a credible first build:
  what to do next, when it is done, and where in Bonn to do it.
site_url: https://robonn-club.github.io/prototype-space/
repo_url: https://github.com/robonn-club/prototype-space
repo_name: robonn-club/prototype-space
edit_uri: ""
copyright: Robonn · the robotics club at Universität Bonn · content CC BY 4.0

# guide/ and docs/ at the repo root are the source of truth; build.py stages
# the site here, generating the front page, overviews and the browse view.
docs_dir: _build/docs
site_dir: _build/site

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/logo.png
  favicon: assets/favicon.png
  font: false          # Outfit and Manrope are self-hosted; see extra.css.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom      # colours come from extra.css
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom      # colours come from extra.css
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light
  features:
    # Tabs across the top for the four ways in; the sidebar then lists the
    # pages of the current tab, which on a step page is the route itself.
    - navigation.tabs
    - navigation.indexes
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tooltips

# Pages take their titles from the front matter build.py writes, so the labels
# live in one place. build.py fails if a page is built but not listed here.
nav:
  - Home: index.md
  - Steps:
      - steps/index.md
      - steps/plan.md
      - steps/simulate.md
      - steps/parts.md
      - steps/build.md
      - steps/test.md
      - steps/show.md
      - steps/after.md
  - Tracks:
      - tracks/index.md
      - tracks/mobile.md
      - tracks/arm.md
      - tracks/field.md
      - tracks/drone.md
      - tracks/legged.md
      - tracks/sensor.md
      - tracks/software.md
  - Bonn: bonn.md
  - Directory:
      - directory/index.md
      - browse.md
      - directory/tools.md
      - directory/ai.md
      - directory/datasets.md
      - directory/hardware.md
      - directory/spaces.md
      - directory/showing.md
      - directory/funding.md
      - directory/compliance.md
      - directory/city.md

# A link to a heading that does not exist fails the strict build.
validation:
  anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - meta
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
  - pymdownx.superfences
  - pymdownx.smartsymbols

plugins:
  - search

extra_css:
  - assets/extra.css
extra_javascript:
  - assets/browse.js
  - assets/guide.js

extra:
  generator: false
  social:
    - icon: fontawesome/brands/discord
      link: https://discord.gg/sm8nDRntRE
      name: Robonn on Discord
    - icon: fontawesome/brands/github
      link: https://github.com/robonn-club
      name: Robonn on GitHub
